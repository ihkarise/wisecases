<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiseCases — Clinical Scenario Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
    }
    .not-found-card {
      max-width: 540px;
      background: #FFFFFF;
      border: 1px solid var(--color-light-gray);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      box-shadow: var(--shadow-card);
    }
    .not-found-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      color: var(--color-wise-red);
      background: var(--color-wise-red-subtle);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-card">
      <div class="not-found-badge">Error 404 • Diagnostic Pathway Interrupted</div>
      <h1 style="font-size: 32px; font-weight: 800; color: var(--color-deep-navy); margin-bottom: 12px;">
        Clinical Route Not Found
      </h1>
      <p style="font-size: 15px; color: var(--color-slate-gray); line-height: 1.6; margin-bottom: 24px;">
        The requested clinical case or page could not be located in the curriculum repository.
        Please return to the Case Library to resume your diagnostic training.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html#library" class="btn btn-primary">
          Browse Case Library
        </a>
        <a href="index.html#home" class="btn btn-secondary">
          Return Home
        </a>
      </div>
    </div>
  </div>
</body>
</html>
